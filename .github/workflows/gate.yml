name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: unit + hostile-input (never-throw) suites
        run: node --test test/*.test.mjs
      - name: the intrusion red-team re-runs and must reproduce its receipt byte-for-byte
        run: node attack-kit/redteam.mjs --check
      - name: mutation + fuzz gate over the decision kernels (no unreviewed survivors)
        run: node witness-all.mjs
